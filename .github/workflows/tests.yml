name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # The Kaggle CSVs aren't in the repo, so tests that need them are skipped here;
      # the synthetic fixture in tests/fixtures covers the same feature engineering logic
      - name: Run tests
        run: python -m pytest -v -rs
      - name: Check the notebook is valid
        run: python -c "import nbformat; nbformat.validate(nbformat.read('notebooks/titanic_analysis.ipynb', as_version=4)); print('notebook OK')"
